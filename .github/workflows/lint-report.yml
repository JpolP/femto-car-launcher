name: Lint report

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run lint
        run: ./gradlew lintStableDebug --continue --stacktrace
        continue-on-error: true
      - name: Print lint errors
        run: |
          f=app/build/reports/lint-results-stableDebug.sarif
          jq -r '.runs[].results[] | select(.level=="error") | (.ruleId + " " + .locations[0].physicalLocation.artifactLocation.uri + ":" + (.locations[0].physicalLocation.region.startLine|tostring) + " " + .message.text)' $f | sort | uniq | sed 's/^/LINTERR /'
